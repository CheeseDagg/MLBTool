name: MLB HR angles experiment
# Four untested HR angles (handed park, individual platoon, day/night,
# pitcher HR-allowed), walk-forward on 2025 boxscores. Fire by touching
# experiments/RUN-HRANGLES.txt. Dataset cached+committed on first run.
on:
  push:
    paths: ['experiments/RUN-HRANGLES.txt']
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  hrangles:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Selftest (planted effect, null control, leak check)
        working-directory: mlb
        run: python mlb_hrangles_experiment.py --selftest
      - name: Build dataset + run experiment
        working-directory: mlb
        run: python mlb_hrangles_experiment.py
      - name: Commit dataset + verdict
        run: |
          git config user.name mlb-bot
          git config user.email actions@github.com
          for f in mlb/data/hrangles_dataset.json mlb/data/hrangles_burnin_2024.json experiments/MLB-HRANGLES-VERDICT.md; do
            git add "$f" 2>/dev/null || true
          done
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "HR angles experiment verdict $(date -u +%F)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push race - retry $i"; sleep 3
          done
          exit 1
