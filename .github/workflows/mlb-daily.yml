name: MLB daily slate
on:
  schedule:
    - cron: "17 13 * * *"   # 8:17am CT — off-peak minute, board ready by 9 even with GitHub cron drift
    - cron: "47 17 * * *"   # 12:47pm CT — day-game cards before early first pitches
    - cron: "17 20 * * *"   # 3:17pm CT — cards reprice, ready by 4
  workflow_dispatch: {}
  push:
    paths: ['experiments/REBUILD.txt']   # touch this file to rebuild the board on demand
permissions:
  contents: write
concurrency:
  group: mlb-daily-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install deps
        run: pip install pybaseball MLB-StatsAPI pandas numpy
      - name: Pull data + publish slate
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        working-directory: mlb
        run: |
          python mlb_pitchers.py
          python mlb_statcast.py
          python mlb_data.py || true
          python mlb_odds.py || true
          python mlb_grade.py || true
          python mlb_hr.py || true
          python mlb_publish.py
      - name: Pull futures (morning run only — odds move slowly, saves API quota)
        if: github.event.schedule == '17 13 * * *' || github.event_name == 'workflow_dispatch'
        working-directory: mlb
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python mlb_futures.py || true
          python mlb_publish.py
      - name: Build K props off the slate just built
        # In-run, not chained: pushes made with GITHUB_TOKEN never trigger other
        # workflows, so the 'kprops on slate.json push' chain in mlb-kprops.yml
        # only fires on PAT/manual pushes. Building here guarantees the K board
        # is never older than the slate it prices. Fail-soft: a K-props hiccup
        # must not block the slate publish.
        working-directory: mlb
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python mlb_kprops_run.py || true
      - name: Validate slate.json is browser-parseable
        run: |
          node -e "JSON.parse(require('fs').readFileSync('mlb/data/slate.json','utf8')); console.log('slate.json OK for browsers')"
      - name: Commit fresh slate
        run: |
          git config user.name "mlb-bot"
          git config user.email "actions@github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --mixed origin/main
            # Stage every ALREADY-TRACKED file under mlb/data that this run changed.
            # The previous version listed six paths by hand, which meant lineshop.json,
            # bvp_board.json and recalib_report.json were regenerated each run and then
            # thrown away -- and any file added later inherited the same fate silently.
            # `-u` is deliberately scoped to tracked files so a stray cache or a large
            # experiment dump can never ride along uninvited.
            git add -u mlb/data/ 2>/dev/null || true
            # New daily artifacts must be named ONCE here, the first time they exist;
            # after that -u carries them. league_daily.csv is the league HR/PA control
            # and is worthless unless it ACCUMULATES across runs -- an Actions checkout
            # is fresh every time, so a file that is never committed is a file that
            # never has more than one day in it.
            git add mlb/data/league_daily.csv 2>/dev/null || true
            if git diff --cached --quiet; then
              echo "Slate unchanged vs published -- nothing to commit."
              exit 0
            fi
            git commit -m "daily slate $(date -u +%F)"
            git push origin HEAD:main && { echo "Published on attempt $attempt."; exit 0; }
            echo "Remote advanced during push (attempt $attempt) -- retrying on new tip."
          done
          echo "::error::Failed to publish slate after 5 attempts."
          exit 1
