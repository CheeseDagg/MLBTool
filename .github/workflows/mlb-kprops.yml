name: MLB K props
# Projects every starter's strikeout distribution and shops pitcher_strikeouts
# odds across the books with the same double-gate as HR Shop. Runs after the
# daily slate exists; same afternoon/evening cadence as the HR line shop.
on:
  # SCHEDULE OFF 2026-08-04: pitcher props are excluded from betting by standing
  # instruction, yet this cron was the single biggest consumer of the shared
  # Odds API quota (~15 events x several credits, three times a day) and helped
  # drain the month's credits in two days. On-demand triggers remain below.
  workflow_dispatch: {}
  push:
    paths:
      - 'experiments/REBUILD-KPROPS.txt'   # touch to rebuild the K board on demand
      - 'mlb/data/slate.json'              # auto-rebuild K board whenever a fresh slate publishes
                                           # (fixes the race where K ran before the new slate landed,
                                           #  the stale-guard rightly refused, and yesterday's board stayed up)
permissions:
  contents: write
jobs:
  kprops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install deps
        run: pip install MLB-StatsAPI
      - name: Project + shop K props
        working-directory: mlb
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python mlb_kprops.py --selftest
          python mlb_kprops_run.py
      - name: Commit
        run: |
          git config user.name mlb-bot
          git config user.email mlb-bot@users.noreply.github.com
          git add mlb/data/kprops.json
          git commit -m "K props refresh" || { echo "no changes"; exit 0; }
          # Rebase onto and push to THE REF THAT TRIGGERED THIS RUN. This was
          # hardcoded to main, which silently rebased PR-branch runs onto main
          # and flattened away the branch's merge commits -- every push then
          # rejected non-fast-forward and every retry re-pulled main ("already
          # up to date") and re-pushed the same doomed tip (2026-08-13, PR #1).
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin ${{ github.ref_name }} \
              && git push origin HEAD:${{ github.ref_name }} && exit 0
            echo "push race - retry $i"; sleep $((RANDOM % 4 + 2))
          done
          echo "push still rejected after 5 tries"; exit 1
