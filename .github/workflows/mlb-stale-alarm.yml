name: MLB staleness alarm
# Fails (= GitHub emails you) if the slate hasn't been rebuilt in 40h.
# A silent dead cron can no longer go unnoticed.
on:
  schedule:
    # 15:30 UTC = 10:30am CT. The morning build's worst measured landing time is
    # 14:40 UTC, so by 15:30 a missing board is missing, not late. The 18:30 check
    # alone was too forgiving to be useful in the morning: it ran at 1:30pm CT,
    # four hours after the board should have been up, and by then the 17:47 run
    # was about to paper over the gap anyway. On 07-31 the user spotted the stale
    # board himself, hours before this alarm would have said a word.
    - cron: "30 15 * * *"
    - cron: "30 18 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Slate freshness
        run: |
          TS=$(git log -1 --format=%ct -- "mlb/data/slate.json")
          [ -n "$TS" ] || { echo "::error::mlb/data/slate.json has never been committed"; exit 1; }
          AGE=$(( ($(date +%s) - TS) / 3600 ))
          echo "slate age: ${AGE}h (limit 40h)"
          if [ "$AGE" -gt "40" ]; then
            echo "::error::STALE — mlb/data/slate.json is ${AGE}h old. The daily pipeline has stopped. Check the main workflow runs."
            exit 1
          fi
          LATEST=$(python3 -c "import json; d=json.load(open('mlb/data/slate.json')); print(d.get('slate_end') or d.get('slate_date') or '')")
          TODAY=$(date -u +%F)
          echo "newest game in slate: ${LATEST:-unknown} (today $TODAY)"
          if [ -n "$LATEST" ] && [[ "$LATEST" < "$TODAY" ]]; then
            echo "::error::STALE DATA — newest game in the slate is $LATEST but today is $TODAY. The build runs but the game data is frozen (commit time alone wouldn't catch this)."
            exit 1
          fi
          echo "fresh (commit + game dates current)."
